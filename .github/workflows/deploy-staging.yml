name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy fe-stage to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VPS_HOST}" ]; then echo "::error::Missing repository secret VPS_HOST"; missing=1; fi
          if [ -z "${VPS_USER}" ]; then echo "::error::Missing repository secret VPS_USER"; missing=1; fi
          if [ -z "${VPS_PORT}" ]; then echo "::error::Missing repository secret VPS_PORT"; missing=1; fi
          if [ -z "${VPS_SSH_PRIVATE_KEY}" ] && [ -z "${VPS_PASSWORD}" ]; then
            echo "::error::Missing auth secret: set VPS_SSH_PRIVATE_KEY (preferred, reuse BE key) or VPS_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets at: Settings → Secrets and variables → Actions"
            echo "Copy VPS_* from cari-kerja-backend, or see docs/DEPLOY.md"
            exit 1
          fi
          echo "Deploy secrets present (values not printed)"

      # GitHub runners occasionally cannot dial this VPS on the first try
      # (TCP connect timeout). Retry a few times before failing the job.
      - name: Deploy over SSH (attempt 1)
        id: ssh1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          protocol: tcp
          timeout: 5m
          command_timeout: 25m
          script: |
            set -euo pipefail
            PROJECT_DIR="/var/www/cari-kerja"
            FRONTEND_DIR="fe-stage-cari-kerja"
            SCRIPT_SRC="${PROJECT_DIR}/${FRONTEND_DIR}/scripts/deploy/staging-fe-remote.sh"

            cd "$PROJECT_DIR"
            git -C "$FRONTEND_DIR" fetch origin
            git -C "$FRONTEND_DIR" checkout develop
            git -C "$FRONTEND_DIR" reset --hard origin/develop

            if [[ -f "$SCRIPT_SRC" ]]; then
              chmod +x "$SCRIPT_SRC"
              bash "$SCRIPT_SRC"
            else
              echo "Deploy script missing after pull; running inline fallback"
              docker compose up -d --build fe-stage
              docker image prune -f
              for i in $(seq 1 12); do
                if curl -fsS https://fe-stage.cari-kerja.co.id/ >/dev/null; then
                  echo "Health OK"
                  exit 0
                fi
                sleep 5
              done
              echo "Health check failed"
              exit 1
            fi

      - name: Wait before SSH retry
        if: steps.ssh1.outcome == 'failure'
        run: |
          echo "SSH attempt 1 failed; waiting 45s before retry..."
          sleep 45

      - name: Deploy over SSH (attempt 2)
        id: ssh2
        if: steps.ssh1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          protocol: tcp
          timeout: 5m
          command_timeout: 25m
          script: |
            set -euo pipefail
            PROJECT_DIR="/var/www/cari-kerja"
            FRONTEND_DIR="fe-stage-cari-kerja"
            SCRIPT_SRC="${PROJECT_DIR}/${FRONTEND_DIR}/scripts/deploy/staging-fe-remote.sh"

            cd "$PROJECT_DIR"
            git -C "$FRONTEND_DIR" fetch origin
            git -C "$FRONTEND_DIR" checkout develop
            git -C "$FRONTEND_DIR" reset --hard origin/develop

            if [[ -f "$SCRIPT_SRC" ]]; then
              chmod +x "$SCRIPT_SRC"
              bash "$SCRIPT_SRC"
            else
              echo "Deploy script missing after pull; running inline fallback"
              docker compose up -d --build fe-stage
              docker image prune -f
              for i in $(seq 1 12); do
                if curl -fsS https://fe-stage.cari-kerja.co.id/ >/dev/null; then
                  echo "Health OK"
                  exit 0
                fi
                sleep 5
              done
              echo "Health check failed"
              exit 1
            fi

      - name: Wait before final SSH retry
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure'
        run: |
          echo "SSH attempt 2 failed; waiting 60s before final retry..."
          sleep 60

      - name: Deploy over SSH (attempt 3)
        id: ssh3
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          protocol: tcp
          timeout: 5m
          command_timeout: 25m
          script: |
            set -euo pipefail
            PROJECT_DIR="/var/www/cari-kerja"
            FRONTEND_DIR="fe-stage-cari-kerja"
            SCRIPT_SRC="${PROJECT_DIR}/${FRONTEND_DIR}/scripts/deploy/staging-fe-remote.sh"

            cd "$PROJECT_DIR"
            git -C "$FRONTEND_DIR" fetch origin
            git -C "$FRONTEND_DIR" checkout develop
            git -C "$FRONTEND_DIR" reset --hard origin/develop

            if [[ -f "$SCRIPT_SRC" ]]; then
              chmod +x "$SCRIPT_SRC"
              bash "$SCRIPT_SRC"
            else
              echo "Deploy script missing after pull; running inline fallback"
              docker compose up -d --build fe-stage
              docker image prune -f
              for i in $(seq 1 12); do
                if curl -fsS https://fe-stage.cari-kerja.co.id/ >/dev/null; then
                  echo "Health OK"
                  exit 0
                fi
                sleep 5
              done
              echo "Health check failed"
              exit 1
            fi

      - name: Fail if all SSH attempts failed
        if: steps.ssh1.outcome == 'failure' && steps.ssh2.outcome == 'failure' && steps.ssh3.outcome == 'failure'
        run: |
          echo "::error::All 3 SSH deploy attempts failed (likely runner→VPS dial timeout)."
          exit 1

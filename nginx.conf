server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets are immutable — cache aggressively.
    # New deploys emit new filenames, so browsers fetch new files automatically
    # as soon as they load a fresh index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML entry must NEVER be stored by browsers/proxies. Otherwise Edge/Chrome
    # can keep an old index.html that still points at previous JS/CSS hashes.
    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets are immutable — cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated, otherwise browsers keep
    # loading old JS/CSS bundles after a deploy (stale UI bugs).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
